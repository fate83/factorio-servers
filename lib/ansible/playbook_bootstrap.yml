---
- name: bootstrap Ubuntu vServer
  hosts: factorio-servers
  pre_tasks:
    - name: install updates
      tags: always
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_user_id == "root"

    - name: create group for ansible service user
      tags: always
      user:
        name: ansible
      when: ansible_user_id == "root"

    - name: create ansible service user
      tags: always
      user:
        name: ansible
        group: ansible
      when: ansible_user_id == "root"

    - name: add ssh key for ansible service user
      tags: always
      authorized_key:
        user: ansible
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILaQkCxaVqFy5oMpyXq2jA+nGIbS6W7N4xXl99i4k8ja"
      when: ansible_user_id == "root"

    - name: add sudoers file for ansible service user
      tags: always
      copy:
        src: sudoer_ansible
        dest: /etc/sudoers.d/ansible
        owner: root
        group: root
        mode: 0440
      when: ansible_user_id == "root"
